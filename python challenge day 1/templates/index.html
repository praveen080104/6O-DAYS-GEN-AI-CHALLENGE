<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greeting Form</title>

<!-- Google font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    body, html {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: 'Poppins', sans-serif;
    }

    /* Background container for Vanta */
    #vanta-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }

    /* ⭐ Transparent Glass Form ⭐ */
    .glass-form {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        padding: 40px;
        border-radius: 20px;
        width: 460px;

        text-align: center;
        color: white;
        border: 1px solid rgba(255,255,255,0.3);
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    input {
        width: 90%;
        padding: 15px;
        border-radius: 12px;
        border: none;
        margin-top: 12px;
        font-size: 16px;
        outline: none;
    }

    /* ✅ Age slider style */
    input[type="range"] {
        -webkit-appearance: none;
        width: 90%;
        height: 6px;
        background: #472bff;
        border-radius: 3px;
        margin-top: 20px;
        cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: white;
        cursor: pointer;
    }

    /* Button */
    button {
        width: 90%;
        padding: 15px;
        border-radius: 12px;
        border: none;
        margin-top: 20px;
        font-size: 17px;
        font-weight: bold;
        color: white;
        background: linear-gradient(to right, #ff4b8e, #fb041c);
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
    }

</style>
</head>
<body>

<div id="vanta-bg"></div>

<div class="glass-form">
    <h2>✨ Greeting Form ✨</h2>

    <form action="/" method="POST">
        <input type="text" placeholder="Enter your name" name="name" required>

        <p style="margin-top:15px; font-weight:600;">Age: <span id="ageValue">18</span></p>

        <!-- ✅ Slider -->
        <input type="range" min="1" max="100" value="18" name="age" id="ageSlider">

        <button type="submit">Show Greeting 🚀</button>
    </form>

    {% if greeting %}
        <h3 style="margin-top:20px; color:#fff;">{{ greeting }}</h3>
    {% endif %}
</div>

<script>
    document.getElementById("ageSlider").oninput = function(){
        document.getElementById("ageValue").innerText = this.value;
    };
</script>

<!-- Vanta + Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.birds.min.js"></script>

<script>
VANTA.BIRDS({
  el: "#vanta-bg",
  backgroundColor: 0x07192f,
  backgroundAlpha: 1,
  color1: 0xff0000,
  color2: 0x0d1fff,
  colorMode: "varianceGradient",
  quantity: 5,
  birdSize: 1,
  wingSpan: 30,
  speedLimit: 5,
  separation: 20,
  alignment: 20,
  cohesion: 20,
  mouseControls: true,
  touchControls: true,
  gyroControls: false
});
</script>

</body>
</html>
